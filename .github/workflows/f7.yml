name: f7
on: [workflow_dispatch]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: baseline
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber | Format-List
          (Get-MpComputerStatus).RealTimeProtectionEnabled
      - name: mount and run lnk
        shell: pwsh
        run: |
          $iso = (Resolve-Path .\kit.iso).Path
          Mount-DiskImage -ImagePath $iso
          $v = Get-Volume -FileSystemLabel RH26
          Write-Host "drive=$($v.DriveLetter) fs=$($v.FileSystemType)"
          Get-ChildItem "$($v.DriveLetter):\" | Format-Table Name,Length
          $lnk = Get-ChildItem "$($v.DriveLetter):\*.lnk" | Select-Object -First 1
          Invoke-Item $lnk.FullName
          Start-Sleep -Seconds 90
          Write-Host "--- outro lado ---"
      - name: wait more
        shell: pwsh
        run: Start-Sleep -Seconds 60
