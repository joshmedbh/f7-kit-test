name: f7
on: [workflow_dispatch]
jobs:
  t:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: baseline
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber | Format-List
          "defender=" + (Get-MpComputerStatus).RealTimeProtectionEnabled
      - name: mount
        shell: pwsh
        run: |
          Mount-DiskImage -ImagePath (Resolve-Path .\kit.iso).Path
          $v = Get-Volume -FileSystemLabel RH26
          "drive=$($v.DriveLetter)"
          $lnk = Get-ChildItem "$($v.DriveLetter):\*.lnk" | Select-Object -First 1
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName)
          "target=" + $s.TargetPath
          "args=" + $s.Arguments
          "wd=" + $s.WorkingDirectory
          "icon=" + $s.IconLocation
          "--- tentativa 1: start ---"
          cmd /c start "" "$($lnk.FullName)"
          Start-Sleep -Seconds 20
          "--- tentativa 2: direto ---"
          Start-Process $s.TargetPath -ArgumentList $s.Arguments
          Start-Sleep -Seconds 30
      - name: wait
        shell: pwsh
        run: |
          Start-Sleep -Seconds 90
          Get-Process powershell -ErrorAction SilentlyContinue | Select-Object Id,StartTime | Format-Table
